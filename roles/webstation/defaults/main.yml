---
################################
# Basics
################################

# Named romm-webstation (not webstation) so the RomM link is clear in docker ps / logs.
webstation_name: romm-webstation

################################
# Settings
################################

# Streaming needs RomM >= 5.3.0-alpha.1; the role fails with guidance if older.
webstation_role_romm_required_version: "5.3.0-alpha.1"
# Set false if RomM is managed separately.
webstation_role_dependency_romm: true
# Label shown in the RomM UI streaming selector.
webstation_role_label: "Webstation"
# Public URL prefix the selkies stream / broker are served under.
webstation_role_subfolder: "/streaming"

################################
# Web
################################

# Served by Traefik at https://romm-stream.<domain>, mirroring the RomM role.
webstation_role_web_subdomain: "romm-stream"
webstation_role_web_domain: "{{ user.domain }}"
# Broker's internal HTTP frontend (container port 3000); Traefik terminates TLS.
webstation_role_web_port: "3000"
webstation_role_web_scheme: "http"
webstation_role_web_url: "{{ lookup('role_web', role='webstation', scheme='https') }}"

################################
# DNS
################################

webstation_role_dns_record: "{{ lookup('role_var', '_web_subdomain', role='webstation') }}"
webstation_role_dns_zone: "{{ lookup('role_var', '_web_domain', role='webstation') }}"
webstation_role_dns_proxy: "{{ dns_proxied }}"

################################
# Traefik
################################

# Mirrors RomM's Traefik setup (authelia + cloudflarewarp SSO, cfdns certs).
webstation_role_traefik_sso_middleware: "{{ traefik_default_sso_middleware }}"
webstation_role_traefik_middleware_default: "{{ traefik_default_middleware }}"
webstation_role_traefik_middleware_custom: ""
webstation_role_traefik_middleware_default_api: "{{ traefik_default_middleware_api }}"
webstation_role_traefik_middleware_custom_api: ""
webstation_role_traefik_certresolver: "{{ traefik_default_certresolver }}"
webstation_role_traefik_enabled: true
webstation_role_traefik_api_enabled: false
webstation_role_traefik_api_endpoint: ""

# Broker API base; server-to-server only on the docker network (no TLS broker-side).
webstation_role_broker_host: "http://{{ webstation_name }}:3000"

# slug -> {emulator, label} this container serves. Amiga-only for now
# (the original reason for webstation); expand the map later as needed.
webstation_role_platforms:
  amiga:
    emulator: retroarch
    label: Amiga
webstation_role_bios_folders:
  psx: ps

################################
# Paths
################################

webstation_role_paths_folder: "{{ webstation_name }}"
webstation_role_paths_location: "{{ server_appdata_path }}/{{ webstation_role_paths_folder }}"
webstation_role_paths_folders_list:
  - "{{ webstation_role_paths_location }}"
  - "{{ webstation_role_paths_location }}/config"
  - "{{ webstation_role_host_system_dir }}"

# Read-only mirror of RomM's library; the broker resolves rom.full_path under it.
# Inherits RomM's library (override for standalone use).
webstation_role_library_folder: "{{ romm_role_library_folder }}"
webstation_role_library_mount: "{{ webstation_role_library_folder }}"
webstation_role_library_target: "/romm/library"

# Flat role-managed host dir holding the synced BIOS; user only adds files to RomM's library.
webstation_role_host_system_dir: "{{ webstation_role_paths_location }}/system"
# RetroArch's effective system directory (HOME=/config); cores resolve firmware here.
webstation_role_system_effective_dir: "/config/.config/retroarch/system"

################################
# Docker
################################

# Container
webstation_role_docker_container: "{{ webstation_name }}"

# Image
webstation_role_docker_image_pull: true
webstation_role_docker_image_repo: "lscr.io/linuxserver/webstation"
# `romm` tag = RomM-tailored build; do not use `latest`.
webstation_role_docker_image_tag: "romm"
webstation_role_docker_image: "{{ lookup('role_var', '_docker_image_repo', role='webstation') }}:{{ lookup('role_var', '_docker_image_tag', role='webstation') }}"

# Envs
webstation_role_docker_envs_default:
  TZ: "{{ tz }}"
  PUID: "{{ uid }}"
  PGID: "{{ gid }}"
  SUBFOLDER: "{{ webstation_role_subfolder }}/"
  BROKER_SECRET: "{{ webstation_broker_secret_saltbox_facts.facts.secret_key }}"
  ROM_ROOT: "{{ webstation_role_library_target }}"
  PIXELFLUX_WAYLAND: "true"
webstation_role_docker_envs_custom: {}
webstation_role_docker_envs: "{{ lookup('role_var', '_docker_envs_default', role='webstation')
                               | combine(lookup('role_var', '_docker_envs_custom', role='webstation')) }}"

# Volumes
webstation_role_docker_volumes_default:
  - "{{ webstation_role_paths_location }}/config:/config"
webstation_role_docker_volumes_custom: []
webstation_role_docker_volumes: "{{ lookup('role_var', '_docker_volumes_default', role='webstation')
                                   + lookup('role_var', '_docker_volumes_custom', role='webstation') }}"

# Mounts
webstation_role_docker_mounts_default:
  - type: bind
    source: "{{ webstation_role_library_mount }}"
    target: "{{ webstation_role_library_target }}"
    read_only: true
  # Staging dir (synced BIOS) bound to RetroArch's system dir; read-write because staging is disposable and some cores write here.
  - type: bind
    source: "{{ webstation_role_host_system_dir }}"
    target: "{{ webstation_role_system_effective_dir }}"
webstation_role_docker_mounts_custom: []
webstation_role_docker_mounts: "{{ lookup('role_var', '_docker_mounts_default', role='webstation')
                                   + lookup('role_var', '_docker_mounts_custom', role='webstation') }}"

# Traefik-only by default: https://romm-stream.<domain> -> container port 3000, behind
# the stack SSO. The RomM Play buttons and desktop sessions launch from RomM.
# Direct LAN GUI (ports 3000/3001, self-signed) is OFF by default - enable
# webstation_role_direct_access_enabled only on a trusted network; the GUI has no
# auth and includes a passwordless-sudo terminal.
webstation_role_direct_access_enabled: false
webstation_role_docker_ports_default: "{{ ['3000:3000', '3001:3001'] if webstation_role_direct_access_enabled | bool else [] }}"
webstation_role_docker_ports_custom: []
webstation_role_docker_ports: "{{ lookup('role_var', '_docker_ports_default', role='webstation')
                                 + lookup('role_var', '_docker_ports_custom', role='webstation') }}"

# Hostname
webstation_role_docker_hostname: "{{ webstation_name }}"

# Networks
webstation_role_docker_networks_alias: "{{ webstation_name }}"
webstation_role_docker_networks_default: []
webstation_role_docker_networks_custom: []
webstation_role_docker_networks: "{{ docker_networks_common
                                    + lookup('role_var', '_docker_networks_default', role='webstation')
                                    + lookup('role_var', '_docker_networks_custom', role='webstation') }}"

# GPU
# Hardware rendering is effectively required for emulators; enables /dev/dri.
webstation_role_docker_gpu_enabled: true

# Shared memory (selkies/codecs)
webstation_role_docker_shm_size: "1G"

# Restart Policy
webstation_role_docker_restart_policy: unless-stopped

# Healthcheck hits the broker API under the SUBFOLDER prefix (curl is in the base image).
webstation_role_docker_healthcheck:
  test:
    - "CMD-SHELL"
    - "curl -fs http://localhost:3000{{ webstation_role_subfolder }}/api/health || exit 1"
  interval: 60s
  retries: 5
  start_period: 120s
  timeout: 10s

# No _docker_user: the LSIO image manages its own (PUID/PGID) user.
# DNS/Traefik mirror the RomM role, serving https://romm-stream.<domain>.
