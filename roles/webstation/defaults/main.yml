# BIOS sync: RetroArch resolves ALL system files from its single effective
# system dir, so per-platform bios/<folder>/ trees cannot each bind-mount there.
# The role syncs every mapped platform's BIOS into the staging dir on each run
# (re-run the role after adding BIOS to RomM). Folders default to the platform
# slug; entries here override names that differ - folders are NOT slugs (RomM
# tracks PlayStation firmware in bios/ps/ while the slug is psx).
webstation_role_bios_folders:
  psx: ps

################################
# Paths
################################

webstation_role_paths_folder: "{{ webstation_name }}"
webstation_role_paths_location: "{{ server_appdata_path }}/{{ webstation_role_paths_folder }}"
webstation_role_paths_folders_list:
  - "{{ webstation_role_paths_location }}"
  - "{{ webstation_role_paths_location }}/config"
  - "{{ webstation_role_host_system_dir }}"

# Library read-only mirror. RomM stores rom.full_path relative to the library
# root (e.g. "roms/amiga/foo.zip"), so the broker resolves
# library_path + full_path. Mirroring romm's own mount 1:1 (same host source,
# /romm/library) keeps that path valid inside this container. Inherits RomM's
# library because webstation streams RomM's ROMs; standalone use
# (webstation_role_dependency_romm: false) must set this explicitly.
webstation_role_library_folder: "{{ romm_role_library_folder }}"
webstation_role_library_mount: "{{ webstation_role_library_folder }}"
webstation_role_library_target: "/romm/library"

# BIOS staging: a flat role-managed host dir (no tree for the user to build) holding
# the synced contents of every mapped platform's bios/<folder>/ tree. The user
# only places files in RomM's library - nothing is bundled in the role.
# Bind-mounted to webstation_role_system_effective_dir below.
webstation_role_host_system_dir: "{{ webstation_role_paths_location }}/system"
# Container-side target: RetroArch's effective system directory (system_directory
# in retroarch.cfg with HOME=/config). PUAE probes <system>/capsimg.so first and
# kickstarts at root; other cores resolve their firmware the same way.
webstation_role_system_effective_dir: "/config/.config/retroarch/system"

################################
# Docker
################################

# Container
webstation_role_docker_container: "{{ webstation_name }}"

# Image
webstation_role_docker_image_pull: true
webstation_role_docker_image_repo: "lscr.io/linuxserver/webstation"
# The `romm` tag tracks the RomM-tailored webstation build. Do not use `latest`.
webstation_role_docker_image_tag: "romm"
webstation_role_docker_image: "{{ lookup('role_var', '_docker_image_repo', role='webstation') }}:{{ lookup('role_var', '_docker_image_tag', role='webstation') }}"

# Envs
webstation_role_docker_envs_default:
  TZ: "{{ tz }}"
  PUID: "{{ uid }}"
  PGID: "{{ gid }}"
  SUBFOLDER: "{{ webstation_role_subfolder }}/"
  BROKER_SECRET: "{{ webstation_broker_secret_saltbox_facts.facts.secret_key }}"
  ROM_ROOT: "{{ webstation_role_library_target }}"
  PIXELFLUX_WAYLAND: "true"
webstation_role_docker_envs_custom: {}
webstation_role_docker_envs: "{{ lookup('role_var', '_docker_envs_default', role='webstation')
                               | combine(lookup('role_var', '_docker_envs_custom', role='webstation')) }}"

# Volumes
webstation_role_docker_volumes_default:
  - "{{ webstation_role_paths_location }}/config:/config"
webstation_role_docker_volumes_custom: []
webstation_role_docker_volumes: "{{ lookup('role_var', '_docker_volumes_default', role='webstation')
                                   + lookup('role_var', '_docker_volumes_custom', role='webstation') }}"

# Mounts
webstation_role_docker_mounts_default:
  - type: bind
    source: "{{ webstation_role_library_mount }}"
    target: "{{ webstation_role_library_target }}"
    read_only: true
  # Staging dir (role-synced platform BIOS, flat) bound to RetroArch's effective
  # system dir. Read-write: staging is disposable (re-synced every run) and some
  # cores write alongside their system files; the shared library stays pristine
  # behind the read-only mount above. Saves/states live under
  # /config/.retroarch per broker.cfg, never in system.
  - type: bind
    source: "{{ webstation_role_host_system_dir }}"
    target: "{{ webstation_role_system_effective_dir }}"
webstation_role_docker_mounts_custom: []
webstation_role_docker_mounts: "{{ lookup('role_var', '_docker_mounts_default', role='webstation')
                                   + lookup('role_var', '_docker_mounts_custom', role='webstation') }}"

# Access model: traefik-only by default. Traefik routes
# https://romm-stream.<domain> to the container's HTTP frontend (port 3000).
# The stream plays through RomM's Play buttons, desktop sessions launch from
# RomM (broker `desktop` launcher, no config needed), and the full Selkies UI
# answers on the same origin - all behind the stack SSO (authelia).
#
# Direct LAN access to the desktop GUI (the original container experience:
# https://<host>:3001, self-signed cert) is OFF by default. Enable it in
# host_vars/localhost.yml:
#   webstation_role_direct_access_enabled: true
# WARNING: only on a trusted local network. The GUI ships with no built-in
# auth and includes a passwordless-sudo terminal - anyone who can reach these
# ports owns the container.
webstation_role_direct_access_enabled: false
webstation_role_docker_ports_default: "{{ ['3000:3000', '3001:3001'] if webstation_role_direct_access_enabled | bool else [] }}"
webstation_role_docker_ports_custom: []
webstation_role_docker_ports: "{{ lookup('role_var', '_docker_ports_default', role='webstation')
                                 + lookup('role_var', '_docker_ports_custom', role='webstation') }}"

# Hostname
webstation_role_docker_hostname: "{{ webstation_name }}"

# Networks
webstation_role_docker_networks_alias: "{{ webstation_name }}"
webstation_role_docker_networks_default: []
webstation_role_docker_networks_custom: []
webstation_role_docker_networks: "{{ docker_networks_common
                                    + lookup('role_var', '_docker_networks_default', role='webstation')
                                    + lookup('role_var', '_docker_networks_custom', role='webstation') }}"

# GPU
# Hardware rendering is effectively required for emulators (software rendering
# covers the desktop only). Enables the /dev/dri device on Intel hosts.
webstation_role_docker_gpu_enabled: true

# Shared memory (selkies/codecs)
webstation_role_docker_shm_size: "1G"

# Restart Policy
webstation_role_docker_restart_policy: unless-stopped

# Healthcheck: broker API under the SUBFOLDER prefix (curl is present in the
# LSIO selkies base image).
webstation_role_docker_healthcheck:
  test:
    - "CMD-SHELL"
    - "curl -fs http://localhost:3000{{ webstation_role_subfolder }}/api/health || exit 1"
  interval: 60s
  retries: 5
  start_period: 120s
  timeout: 10s

# No _docker_user: the LSIO image manages its own (PUID/PGID) user.
# DNS/Traefik: mirrors the RomM role so the stream is served at
# https://romm-stream.<domain> behind traefik (authelia SSO, cfdns certs).