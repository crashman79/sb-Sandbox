---
################################
# Basics
################################

# Container identity: named romm-webstation (not webstation) so the association
# with RomM is obvious in docker ps/logs and cleanup is unambiguous. Drives the
# container name, hostname, network alias, broker_host and data folder.
webstation_name: romm-webstation

################################
# Settings
################################

# RomM streaming V2 (webstation protocol) requires RomM 5.3.0-alpha.1+.
# This role does NOT upgrade RomM automatically; it fails with instructions
# when the running container is too old.
webstation_role_romm_required_version: "5.3.0-alpha.1"
# Include the RomM role so the backend, config and library stay in sync.
webstation_role_dependency_romm: true
# Label shown in the RomM UI streaming selector.
webstation_role_label: "Webstation"
# Public URL prefix the selkies stream / broker are served under.
webstation_role_subfolder: "/streaming"

################################
# Web
################################

# Streaming is served through traefik at https://romm-stream.<domain>,
# mirroring the RomM role. The subdomain was chosen to avoid clashing with the
# `webstation` container name used for broker_host.
webstation_role_web_subdomain: "romm-stream"
webstation_role_web_domain: "{{ user.domain }}"
# The broker's own HTTP frontend (port 3000 in the container). Traefik targets
# this for its loadbalancer; the stream is only ever served HTTPS externally.
webstation_role_web_port: "3000"
webstation_role_web_scheme: "http"
webstation_role_web_url: "{{ lookup('role_web', role='webstation', scheme='https') }}"

################################
# DNS
################################

webstation_role_dns_record: "{{ lookup('role_var', '_web_subdomain', role='webstation') }}"
webstation_role_dns_zone: "{{ lookup('role_var', '_web_domain', role='webstation') }}"
webstation_role_dns_proxy: "{{ dns_proxied }}"

################################
# Traefik
################################

# Same router setup as RomM: authelia + cloudflarewarp SSO middleware and the
# cfdns certresolver, so the stream UI inherits the stack's auth and certs.
webstation_role_traefik_sso_middleware: "{{ traefik_default_sso_middleware }}"
webstation_role_traefik_middleware_default: "{{ traefik_default_middleware }}"
webstation_role_traefik_middleware_custom: ""
webstation_role_traefik_middleware_default_api: "{{ traefik_default_middleware_api }}"
webstation_role_traefik_middleware_custom_api: ""
webstation_role_traefik_certresolver: "{{ traefik_default_certresolver }}"
webstation_role_traefik_enabled: true
webstation_role_traefik_api_enabled: false
webstation_role_traefik_api_endpoint: ""

# Broker API base. Server-to-server only, reachable on the docker network via
# the container alias; it must never be hit over HTTPS (no ssl context is
# honored broker-side).
webstation_role_broker_host: "http://{{ webstation_name }}:3000"

# Platforms served by this container. Each entry is either the emulator name
# (shorthand) or a block overriding emulator, label and memory_card_sync for
# that platform (see RomM config reference: streaming). The per-platform label
# names the play action in the RomM UI - human-friendly system or emulator
# names below; the container label only names the fleet view.
#
# Sources: broker 0.8.1 `retroarch_platforms.json` (RomM slug -> libretro core,
# cores download on demand) and the broker `REGISTRY` for standalone emulators.
# Standalone entries (ps2, ngc) follow the RomM migration guide; everything else
# goes through retroarch, whose cores the broker picks from the platform slug.
# NOTE: `psx` is the slug (broker table + RomM reference); the firmware FOLDER
# is bios/ps/ - see webstation_role_bios_folders.
