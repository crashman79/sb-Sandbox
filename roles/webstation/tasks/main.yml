---
- name: Add DNS record
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/dns/tasker.yml"
  vars:
    dns_record: "{{ lookup('role_var', '_dns_record', role='webstation') }}"
    dns_zone: "{{ lookup('role_var', '_dns_zone', role='webstation') }}"
    dns_proxy: "{{ lookup('role_var', '_dns_proxy', role='webstation') }}"

# Remove before including the RomM role so the old container isn't touching the backend mid-change.
- name: Remove existing Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/remove_docker_container.yml"

- name: Include RomM role
  ansible.builtin.include_role:
    name: romm
    public: true
  when: webstation_role_dependency_romm | bool

- name: Save Webstation Broker Secret Saltbox facts
  saltbox_facts:
    role: "webstation"
    instance: "broker_secret"
    keys:
      secret_key: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0755"
    base_path: "{{ server_appdata_path }}"
  register: webstation_broker_secret_saltbox_facts

- name: Get RomM version from the running container
  ansible.builtin.command: "docker exec {{ romm_name }} cat /backend/__version__.py"
  register: webstation_romm_version_output
  changed_when: false
  failed_when: webstation_romm_version_output.stdout | length == 0

- name: Extract RomM version
  ansible.builtin.set_fact:
    webstation_romm_version: "{{ webstation_romm_version_output.stdout | regex_search('[0-9]+(?:\\.[0-9]+){1,2}(?:[a-z0-9.-]+)?') | default('0.0.0', true) }}"

- name: Fail when RomM does not support webstation streaming
  ansible.builtin.fail:
    msg: >-
      Webstation streaming requires RomM >= {{ webstation_role_romm_required_version }}.
      Found {{ webstation_romm_version }}.
      To upgrade, set romm_role_docker_image_tag: "{{ webstation_role_romm_required_version }}"
      in host_vars/localhost.yml, then re-run: sb role romm
  when: webstation_romm_version is version(webstation_role_romm_required_version, '<')

- name: Verify GPU render node exists
  ansible.builtin.stat:
    path: "/dev/dri/renderD128"
  register: webstation_dri
  failed_when: false

- name: Warn if no render node was found
  ansible.builtin.debug:
    msg: >-
      /dev/dri/renderD128 was not found on the host. webstation will fall back
      to software rendering, which is not usable for most emulators.
  when: not webstation_dri.stat.exists

- name: Create directories
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/directories/create_directories.yml"

- name: Check platform BIOS folders in the library
  ansible.builtin.stat:
    path: "{{ webstation_role_library_folder }}/bios/{{ webstation_role_bios_folders[item] | default(item) }}"
  loop: "{{ webstation_role_platforms.keys() | list }}"
  register: webstation_bios_stat
  failed_when: false

- name: Sync platform BIOS into the staging dir
  ansible.builtin.copy:
    src: "{{ item.stat.path }}/"
    dest: "{{ webstation_role_host_system_dir }}/"
    remote_src: true
    owner: "{{ uid }}"
    group: "{{ gid }}"
    mode: "u=rwX,g=rX,o=rX"
  loop: "{{ webstation_bios_stat.results }}"
  when: item.stat.exists and item.stat.isdir
  loop_control:
    label: "{{ item.item }}"

# RomM writes config.yml on first start; wait so we append to it, not fabricate it.
- name: Wait for RomM to generate its config.yml
  ansible.builtin.wait_for:
    path: "{{ romm_role_paths_location }}/config/config.yml"
    search_regex: '(database|redis|filesystem|exclude):'
    timeout: 180
  when: webstation_role_dependency_romm | bool

- name: Configure RomM streaming for Webstation
  ansible.builtin.blockinfile:
    path: "{{ romm_role_paths_location }}/config/config.yml"
    marker: "# {mark} ANSIBLE MANAGED STREAMING (webstation role)"
    block: "{{ lookup('template', 'romm_streaming_config.yml.j2') }}"
    insertafter: EOF
    create: false
  notify: Restart RomM container

- name: Create Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/create_docker_container.yml"

# RomM has no UI for streaming, so this role seeds the block in RomM's config.yml.
# Functionally coupled, but a separate PR from the romm role.
